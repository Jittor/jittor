name: Containers

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "examples/**"
      - "LICENSE.txt"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "README.md"
      - "setup.py"
      - "python/**"
      - "requirements/examples.txt"
      - ".github/workflows/containers.yml"
  push:
    branches:
      - "2.0"
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            image: jittor
            base: ubuntu:24.04
          - name: CUDA 12.2
            image: jittor-cuda
            base: nvidia/cuda:12.2.2-cudnn8-devel-ubuntu22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: FROM_IMAGE=${{ matrix.base }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/jittor:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke-test default notebook command
        shell: bash
        run: |
          set -euo pipefail
          image="local/jittor:${{ matrix.image }}"
          docker run --rm --entrypoint sh "${image}" -c \
            'test -n "$(find /opt/jittor/examples/notebooks -type f -name "*.ipynb" -print -quit)"'
          container="$(docker run --detach "${image}")"
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container}")" != true ]]; then
              docker logs "${container}"
              exit 1
            fi
            if docker logs "${container}" 2>&1 | grep -Eq 'Jupyter Server.*is running at|http://'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container}"
          echo 'notebook server did not become ready' >&2
          exit 1

  publish:
    name: Publish ${{ matrix.name }} image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            image: jittor
            base: ubuntu:24.04
          - name: CUDA 12.2
            image: jittor-cuda
            base: nvidia/cuda:12.2.2-cudnn8-devel-ubuntu22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jittor/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: FROM_IMAGE=${{ matrix.base }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
