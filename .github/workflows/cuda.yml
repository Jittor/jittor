name: CUDA

on:
  pull_request:
    types: [labeled, reopened, synchronize]
  push:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:cuda')
    uses: ./.github/workflows/_ci-baseline.yml

  cuda:
    needs: baseline
    name: nox / cuda
    runs-on: ${{ fromJSON(needs.baseline.outputs.cuda_runner_labels) }}
    timeout-minutes: 180
    steps:
      - name: Verify CUDA runner capability
        shell: bash
        env:
          REQUIRED_CUDA_VERSION: ${{ needs.baseline.outputs.cuda_version }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test -e /dev/nvidiactl
          : "${JITTOR_CI_PYTHON:?JITTOR_CI_PYTHON must name the runner Python}"
          command -v "${JITTOR_CI_PYTHON}" >/dev/null
          command -v nvidia-smi >/dev/null
          command -v nvcc >/dev/null
          "${JITTOR_CI_PYTHON}" --version

          gpu_names="$(nvidia-smi --query-gpu=name --format=csv,noheader)"
          if ! grep -Fxq "NVIDIA GeForce RTX 4090" <<<"${gpu_names}"; then
            printf 'required GPU not found; detected:\n%s\n' "${gpu_names}" >&2
            exit 1
          fi

          nvcc_version="$(nvcc --version)"
          required_pattern="${REQUIRED_CUDA_VERSION//./\\.}"
          if ! grep -Eq "release ${required_pattern}([,[:space:]]|$)" <<<"${nvcc_version}"; then
            printf 'CUDA %s nvcc required; detected:\n%s\n' \
              "${REQUIRED_CUDA_VERSION}" "${nvcc_version}" >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Describe CUDA build configuration
        id: cuda-config
        shell: bash
        env:
          JITTOR_CI_NVCC_FLAGS: ${{ vars.JITTOR_CI_NVCC_FLAGS || '' }}
        run: |
          set -euo pipefail
          cuda_archs="$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tr -d '.' | sort -u | paste -sd, -)"
          test -n "${cuda_archs}"
          nvcc_flags_hash="$(printf '%s' "${JITTOR_CI_NVCC_FLAGS}" | sha256sum | cut -c1-16)"
          echo "cuda_archs=${cuda_archs}" >> "${GITHUB_OUTPUT}"
          echo "nvcc_flags_hash=${nvcc_flags_hash}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned development tools
        shell: bash
        run: |
          set -euo pipefail
          "${JITTOR_CI_PYTHON}" -m pip install -r requirements/dev-tools.txt
      - name: Restore the CUDA Jittor build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}
          restore-keys: |
            jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-
      - name: Run CUDA pytest gates
        shell: bash
        run: |
          set -euo pipefail
          "${JITTOR_CI_PYTHON}" -m nox -s cuda
      - name: Save the CUDA Jittor build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}

  benchmark-cuda:
    needs: [baseline, cuda]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: nox / benchmark_cuda
    runs-on: ${{ fromJSON(needs.baseline.outputs.cuda_runner_labels) }}
    timeout-minutes: 240
    env:
      ASV_RESULTS_DIR: ${{ runner.temp }}/jittor-asv-cuda/results
      ASV_HTML_DIR: ${{ runner.temp }}/jittor-asv-cuda/html
      ASV_MACHINE: github-rtx4090-cuda12-2
      ASV_COMPARE_BASE: ${{ github.event.before }}
    steps:
      - name: Check out source with benchmark history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Describe CUDA build configuration
        id: cuda-config
        shell: bash
        env:
          JITTOR_CI_NVCC_FLAGS: ${{ vars.JITTOR_CI_NVCC_FLAGS || '' }}
        run: |
          set -euo pipefail
          cuda_archs="$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tr -d '.' | sort -u | paste -sd, -)"
          test -n "${cuda_archs}"
          nvcc_flags_hash="$(printf '%s' "${JITTOR_CI_NVCC_FLAGS}" | sha256sum | cut -c1-16)"
          echo "cuda_archs=${cuda_archs}" >> "${GITHUB_OUTPUT}"
          echo "nvcc_flags_hash=${nvcc_flags_hash}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          "${JITTOR_CI_PYTHON}" -m pip install \
            -r requirements/dev-tools.txt \
            astunparse==1.6.3 \
            numpy==1.26.4 \
            pillow==11.0.0 \
            tqdm==4.67.1 \
            transformers==4.56.2
      - name: Restore the CUDA Jittor build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}
          restore-keys: |
            jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-
      - name: Restore prior CUDA ASV results
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ASV_RESULTS_DIR }}
          key: asv-cuda-results-${{ github.sha }}
          restore-keys: |
            asv-cuda-results-
      - name: Record Tiny Llama and optimizer CUDA results
        shell: bash
        run: >-
          "${JITTOR_CI_PYTHON}" -m nox -s benchmark_cuda --
          --bench '^(tiny_llama|optimizer_step)\.'
      - name: Save the CUDA Jittor build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-cuda-${{ runner.os }}-${{ needs.baseline.outputs.cuda_version }}-cuda_archs-${{ steps.cuda-config.outputs.cuda_archs }}-nvcc_flags-${{ steps.cuda-config.outputs.nvcc_flags_hash }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}
      - name: Save CUDA ASV results for the next commit
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ASV_RESULTS_DIR }}
          key: asv-cuda-results-${{ github.sha }}
      - name: Upload CUDA ASV results and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asv-cuda-${{ github.sha }}
          path: |
            ${{ env.ASV_RESULTS_DIR }}
            ${{ env.ASV_HTML_DIR }}
          if-no-files-found: warn
          retention-days: 30
