name: CPU

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: nox / cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native CPU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Run CPU pytest gates
        run: python -m nox -s cpu

  benchmark:
    name: nox / benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native CPU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Validate and smoke-test ASV
        run: python -m nox -s benchmark
