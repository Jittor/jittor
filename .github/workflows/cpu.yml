name: CPU

on:
  pull_request:
  push:
  schedule:
    # Nightly, so the full tier keeps running once `smoke` becomes what a pull
    # request waits for (0.15).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/_ci-baseline.yml

  smoke:
    needs: baseline
    name: nox / smoke
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    container:
      image: ${{ needs.baseline.outputs.cpu_ci_image }}
    # The pull-request tier (0.15): every file the gate reaches in both process
    # modes, minus the 37 recorded in tests/_helpers/tiers.SLOW_FILES, under
    # xdist. The tier's promise -- five minutes -- is asserted in
    # tests/structure/test_gate_tiers.py, arithmetically, against measured
    # per-file costs; an assertion on elapsed wall clock would fail on a busy
    # runner for reasons that have nothing to do with the change. The number
    # below is the runner's patience, and it has to cover the pip installs and
    # a cache miss, not just the tests.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native CPU toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      # The fast tier is only fast with the kernels already built; see the same
      # step in the `cpu` job.
      - name: Restore the Jittor build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-${{ runner.os }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}
          restore-keys: |
            jittor-build-${{ runner.os }}-
      - name: Run the fast CPU tier
        run: python -m nox -s smoke

  cpu:
    needs: baseline
    name: nox / cpu
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    container:
      image: ${{ needs.baseline.outputs.cpu_ci_image }}
    # The full tier runs the whole test tree in two process modes (0.04), plus
    # the manual probes and the independent-PyTorch oracle.
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native CPU toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      # Without this the gate rebuilds Jittor from scratch on every run: the
      # nox sessions share one cache under $JITTOR_LAB_ROOT/_state/nox/cache,
      # which persists on a self-hosted runner and is empty in a fresh
      # container. Measured on eight cores: the same whole-tree native session
      # is 47 minutes cold and 24 minutes warm, and the difference is entirely
      # kernels being compiled again to the same bytes. The key is the build
      # configuration -- the sources that decide what gets compiled -- so a
      # source change invalidates it and a test-only change does not.
      - name: Restore the Jittor build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-${{ runner.os }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}
          restore-keys: |
            jittor-build-${{ runner.os }}-
      - name: Install independent CPU PyTorch oracle
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          echo "REAL_TORCH_SITE=$(python -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"
      - name: Run CPU pytest gates
        env:
          JITTOR_REQUIRE_REAL_TORCH: "1"
        run: python -m nox -s full
      - name: Save the Jittor build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../jittor-lab/_state/nox/cache
          key: jittor-build-${{ runner.os }}-${{ hashFiles('python/jittor/src/**', 'python/jittor/extern/**', 'python/jittor/compiler.py', 'requirements/dev-tools.txt') }}

  benchmark:
    needs: baseline
    name: nox / benchmark
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    container:
      image: ${{ needs.baseline.outputs.cpu_ci_image }}
    timeout-minutes: 90
    env:
      ASV_RESULTS_DIR: ${{ runner.temp }}/jittor-asv/results
      ASV_HTML_DIR: ${{ runner.temp }}/jittor-asv/html
      ASV_MACHINE: github-ubuntu-cpu
      ASV_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native CPU toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Restore prior ASV results
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ASV_RESULTS_DIR }}
          key: asv-results-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            asv-results-${{ runner.os }}-${{ runner.arch }}-
      - name: Record, compare, and publish ASV results
        run: >-
          python -m nox -s benchmark --
          --bench '^(operators|optimizer_step)\.'
      - name: Save ASV results for the next commit
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ASV_RESULTS_DIR }}
          key: asv-results-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Upload ASV results and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asv-${{ github.sha }}
          path: |
            ${{ env.ASV_RESULTS_DIR }}
            ${{ env.ASV_HTML_DIR }}
          if-no-files-found: warn
          retention-days: 30
