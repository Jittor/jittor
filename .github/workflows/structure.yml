name: Structure

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/_ci-baseline.yml

  checks:
    needs: baseline
    name: nox / ${{ matrix.session }}
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        session:
          - structure
          - lint
          - format
          - typing
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve quality-gate base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_ref="${PR_BASE_REF:-2.0-refactor}"
            git fetch --no-tags https://github.com/Jittor/jittor.git "$base_ref"
            base_sha="$(git merge-base HEAD FETCH_HEAD)"
          fi
          echo "JITTOR_CI_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Run ${{ matrix.session }} checks
        run: python -m nox -s "${{ matrix.session }}"

  packaging:
    needs: baseline
    name: nox / packaging
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    container:
      image: ${{ needs.baseline.outputs.cpu_ci_image }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native packaging toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential ca-certificates git libomp-dev
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build the upstream branch wheel for the PR comparison
        if: github.head_ref == 'feat/whisper-cpu-l2-20260923' || github.ref_name == 'feat/whisper-cpu-l2-20260923'
        shell: bash
        run: |
          git clone --depth 1 --single-branch --branch 2.0-refactor \
            https://github.com/Jittor/jittor.git /tmp/jittor-packaging-base
          python -m build --no-isolation --wheel \
            --outdir /tmp/jittor-base-wheel /tmp/jittor-packaging-base
          wheels=(/tmp/jittor-base-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          echo "JITTOR_BASE_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Build and audit Whisper distributions against upstream
        if: github.head_ref == 'feat/whisper-cpu-l2-20260923' || github.ref_name == 'feat/whisper-cpu-l2-20260923'
        run: >-
          python -m nox -s packaging --
          --old-wheel "$JITTOR_BASE_WHEEL"
          --addition-allowlist tools/release/whisper-wheel-additions.txt
          --content-change-allowlist tools/release/whisper-wheel-content-changes.txt
      - name: Build, audit, and self-test distributions
        if: github.head_ref != 'feat/whisper-cpu-l2-20260923' && github.ref_name != 'feat/whisper-cpu-l2-20260923'
        run: python -m nox -s packaging

  python37:
    needs: baseline
    name: nox / py37
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.7
        uses: actions/setup-python@v6
        with:
          python-version: "3.7"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Compile with real Python 3.7
        run: python -m nox -s py37

  python312:
    needs: baseline
    name: nox / py312
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build and self-test with real Python 3.12
        run: python -m nox -s py312

  python313:
    needs: baseline
    name: nox / py313
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build and self-test with real Python 3.13
        run: python -m nox -s py313
