name: Structure

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/_ci-baseline.yml

  checks:
    needs: baseline
    name: nox / ${{ matrix.session }}
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        session:
          - structure
          - lint
          - format
          - typing
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Run ${{ matrix.session }} checks
        run: python -m nox -s "${{ matrix.session }}"

  packaging:
    needs: baseline
    name: nox / packaging
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    container:
      image: ${{ needs.baseline.outputs.cpu_ci_image }}
    timeout-minutes: 30
    steps:
      - name: Install Git and CA certificates for checkout
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates
          update-ca-certificates
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install native packaging toolchain
        run: |
          apt-get install --yes --no-install-recommends build-essential libomp-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build, audit, and self-test distributions
        run: python -m nox -s packaging

  python37:
    needs: baseline
    name: nox / py37
    # setup-python has no Python 3.7 build for Ubuntu 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.7
        uses: actions/setup-python@v6
        with:
          python-version: "3.7"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Compile with real Python 3.7
        run: python -m nox -s py37

  python312:
    needs: baseline
    name: nox / py312
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build and self-test with real Python 3.12
        run: python -m nox -s py312

  python313:
    needs: baseline
    name: nox / py313
    runs-on: ${{ needs.baseline.outputs.host_runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install target Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up nox host Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.baseline.outputs.python_version }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements/dev-tools.txt
      - name: Build and self-test with real Python 3.13
        run: python -m nox -s py313
