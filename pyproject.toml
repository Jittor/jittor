[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jittor-trellis"
version = "0.1.0"
description = "Optional TRELLIS.2 integration for Jittor"
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["jittor>=1.3.11.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.entry-points."jittor.module_patches"]
trellis = "jittor_trellis:register_patches"

[project.entry-points."jittor.external_backends"]
trellis = "jittor_trellis:register_backends"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
