[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jittor-torch"
version = "1.3.11.0"
description = "Independent Torch frontend using Jittor's native Var/Op graph"
requires-python = ">=3.7"
dependencies = ["jittor==1.3.11.0"]

[project.scripts]
jittor-triton-shim = "jittor.compat.triton.deploy:main"
jittor-torch-shim = "jittor.compat.shim.deploy:main"

[tool.setuptools]
include-package-data = true
package-dir = { "jittor.compat" = ".", "torch" = "shim/resources/torch" }
